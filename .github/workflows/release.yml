name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v1.0.6
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != "v$APP_VERSION" ]]; then
            echo 'Release tag and built application version differ' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/Server-Explorer-$APP_VERSION-Windows-Setup.exe" \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Server Explorer $RELEASE_TAG" \
            --generate-notes
